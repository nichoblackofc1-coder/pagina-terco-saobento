<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="25%" stop-color="#E5B239" />
      <stop offset="50%" stop-color="#C58D17" />
      <stop offset="75%" stop-color="#F3D063" />
      <stop offset="100%" stop-color="#996300" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A3358" />
      <stop offset="100%" stop-color="#0E1D33" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Fundo Circular Azul Nobre -->
  <rect width="180" height="180" rx="40" fill="url(#bgGradient)" />
  <circle cx="90" cy="90" r="78" stroke="url(#goldGradient)" stroke-width="3" fill="none" opacity="0.8" />

  <!-- Cruz Dourada Estilizada com Trevos/Detalhes -->
  <g filter="url(#goldGlow)">
    <!-- Haste Vertical -->
    <path d="M78 28 H102 V152 H78 Z" fill="url(#goldGradient)" />
    
    <!-- Haste Horizontal -->
    <path d="M38 58 H142 V82 H38 Z" fill="url(#goldGradient)" />

    <!-- Detalhes nas pontas (Ornamentos de cruz clássica) -->
    <!-- Topo -->
    <path d="M72 28 Q90 18 108 28 Z" fill="url(#goldGradient)" />
    <!-- Base -->
    <path d="M72 152 Q90 162 108 152 Z" fill="url(#goldGradient)" />
    <!-- Esquerda -->
    <path d="M38 52 Q28 70 38 88 Z" fill="url(#goldGradient)" />
    <!-- Direita -->
    <path d="M142 52 Q152 70 142 88 Z" fill="url(#goldGradient)" />

    <!-- Centro / Medalha central com relevo -->
    <circle cx="90" cy="70" r="16" fill="url(#goldGradient)" stroke="#FFE885" stroke-width="2" />
    <circle cx="90" cy="70" r="6" fill="#1A3358" />
  </g>
</svg>